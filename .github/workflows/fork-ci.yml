name: Fork CI

# Fork-only PR CI for jholze/omnigent. Kept in its own file so upstream syncs of
# ci.yml / lint.yml / web-tests.yml never conflict with it. GitHub-hosted
# runners only, no secrets, no security-gate dependency. Commands mirror the
# upstream workflows (ci.yml, lint.yml, web-tests.yml, e2e-ui.yml) so results
# are comparable. DB-server lanes (Postgres/MySQL/CockroachDB), databricks,
# slack and codex-parity lanes are intentionally left out; pytest runs on SQLite.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  OMNIGENT_SKIP_WEB_UI: "true"
  UV_INDEX_URL: https://pypi.org/simple
  PIP_INDEX_URL: https://pypi.org/simple
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint (ruff, pyrefly)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Install dependencies (same extras as upstream lint.yml)
        run: |
          uv sync --locked --group lint \
            --extra hindsight \
            --extra nimble \
            --extra s3 \
            --extra tracing
      - name: ruff check
        run: .venv/bin/python -m ruff check --force-exclude .
      - name: ruff format --check
        run: .venv/bin/python -m ruff format --check --force-exclude .
      - name: pyrefly check
        run: .venv/bin/pyrefly check

  pytest:
    name: Pytest (${{ matrix.group }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: runtime
            paths: tests/runtime
          - group: inner-tools
            paths: tests/inner tests/tools tests/test_errors.py
          - group: repl-sdk
            paths: tests/frontends tests/repl tests/terminals
          - group: server
            paths: tests/server tests/onboarding
          - group: spec-llms
            paths: tests/spec tests/llms
          - group: integration-mock
            paths: tests/integration
            workers: "0"
          - group: runner-stores
            paths: tests/runner tests/stores
          - group: misc
            paths: >-
              tests
              --ignore=tests/e2e
              --ignore=tests/integration
              --ignore=tests/runtime
              --ignore=tests/inner
              --ignore=tests/tools
              --ignore=tests/test_errors.py
              --ignore=tests/frontends
              --ignore=tests/repl
              --ignore=tests/terminals
              --ignore=tests/server
              --ignore=tests/onboarding
              --ignore=tests/spec
              --ignore=tests/llms
              --ignore=tests/codex_parity
              --ignore=tests/runner
              --ignore=tests/stores
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Set up Node.js for local relay tests
        if: matrix.group == 'misc'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Install test system dependencies (as upstream ci.yml)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap tmux
          if [ "${{ matrix.group }}" = "inner-tools" ]; then
            sudo apt-get install -y --no-install-recommends dbus-daemon gnome-keyring
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install dependencies
        run: uv sync --locked --extra all --group test
      - name: Run pytest (SQLite, not databricks)
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          OMNIGENT_TEST_TIMEOUT_SCALE: "4"
        run: |
          mkdir -p artifacts
          # matrix.paths is unquoted on purpose: it word-splits into pytest args.
          # shellcheck disable=SC2086
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u DATABRICKS_TOKEN \
            uv run pytest ${{ matrix.paths }} \
              -m "not databricks" \
              -n ${{ matrix.workers || '4' }} \
              --dist=worksteal \
              --timeout=300 \
              --junitxml=artifacts/pytest-${{ matrix.group }}.xml \
              -v --tb=short -r a \
              || { rc=$?; [ "$rc" -eq 5 ] && echo "::notice::No tests collected in this shard; treating as a pass." || exit "$rc"; }
      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fork-pytest-${{ matrix.group }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 7

  web:
    name: Web (lint, typecheck, vitest, build)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up pnpm + Node 22
        uses: ./.github/actions/setup-pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter web
      - name: Format check (prettier)
        run: pnpm --filter web run format:check
      - name: Lint (oxlint)
        run: pnpm --filter web run lint
      - name: Typecheck (tsc -b)
        run: pnpm --filter web run type-check
      - name: Unit tests (vitest run)
        run: pnpm --filter web run test
      - name: Build
        run: pnpm --filter web run build

  e2e-ui:
    # NON-BLOCKING: many Playwright UI tests already fail on main (~26 known).
    # continue-on-error keeps a red shard from failing the workflow run.
    name: E2E UI (Playwright, non-blocking, shard ${{ matrix.shard }})
    if: ${{ !github.event.pull_request.draft }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ANTHROPIC_API_KEY: ""
      DATABRICKS_TOKEN: ""
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Install project + test dependencies
        run: uv sync --locked --extra all --group test
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Build web SPA
        run: |
          pnpm install --frozen-lockfile --filter web
          pnpm --filter web run build
      - name: Run UI e2e tests (not visual, not nightly)
        run: |
          mkdir -p artifacts
          uv run pytest tests/e2e_ui \
            -v --tb=short -r a \
            --reruns=1 --reruns-delay=5 \
            --ui-skip-build \
            --splits=4 \
            --group=${{ matrix.shard }} \
            --junitxml=artifacts/e2e-ui-${{ matrix.shard }}.xml \
            -m "not visual and not nightly" \
            || { rc=$?; [ "$rc" -eq 5 ] && echo "::notice::No tests collected in this shard; treating as a pass." || exit "$rc"; }
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fork-e2e-ui-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
