# resolve-agent (local) — take a reproduced bug to resolution, or remediate
# requested changes on an existing Resolve-managed PR.
#
# Audits repro-agent's handoff, reviews an existing fix or authors a new one,
# then iterates on CI and Polly/OCR (re-dispatching after every push) until green
# and settled. Publishes preview/live-validation instructions for human review.
#
# It is invoked with a pointer to a completed repro run — either a `session`
# link (local: right after `dev/repro.py`) or a `ci_link` (a CI run URL, when the
# repro ran in throwaway CI and its worktree is gone). From that pointer it
# recovers the verdict/facets/journey and re-materializes the repro test.
#
# Usage (run from the root of your omnigent-ai/omnigent checkout, so the agent's
# working directory is this repo):
#
#   # From a local repro session (the session dev/repro.py just produced):
#   omnigent run dev/resolve-agent \
#     -p '{"session":"http://localhost:6767/c/dc59e331-..."}'
#
#   # From a CI run that executed repro-agent:
#   omnigent run dev/resolve-agent \
#     -p '{"ci_link":"https://github.com/omnigent-ai/omnigent-internal/actions/runs/30974269184"}'
#
# The brain runs on the Claude Agent SDK, so configure a Claude provider first
# (`omnigent setup` — an Anthropic key, a Claude subscription, an
# OpenAI-compatible gateway, or a Databricks workspace). It reads the repro
# session via sys_session_*, uses the shell for `git` / `gh` / running tests, and
# writes the fix and its tests into this checkout.

spec_version: 1
name: resolve_agent
description: >-
  Takes a bug that repro-agent reports as reproduced to resolution, and proves
  it with a fail→pass test transition. Given a pointer to a completed repro run —
  a session link (local) or a CI run URL (ci_link) — it recovers the reproduction
  (verdict, per-facet breakdown, journey) and the reproduction test. Before both
  authoring and reviewing, it independently audits the patch, assertions, and
  behavioral failure on the unfixed base. It repairs or rejects unreliable tests
  with preserved evidence in test_audit, rather than trusting artifact delivery
  or a green test alone. It then looks for an open fix PR: if found it REVIEWS
  that PR with the same audited test, journey, and diff review; otherwise it
  root-causes and implements the fix, selects permanent regression coverage,
  archives investigation-only reproduction source, and re-runs checks to confirm every
  live facet goes fail→pass, and assesses the final diff's impact on other
  consumers in every resolution mode. It records focused checks, revision context,
  evidence, and uncovered boundaries in impact_assessment before claiming fixed.
  It re-records the repro drivers on the fixed tree so
  the before/after footage pair lands in the PR's Demo section (and on the
  Linear ticket when a key is available), then commits, pushes, and opens a
  ready-for-review pull request. It can also remediate trusted human change
  requests on an existing Resolve-managed PR, including its CI and automated
  review failures. It does not merge.

# Runs on the Claude Agent SDK. No model is pinned, so the configured provider's
# default model is used. The large context window holds the repro session
# transcript, the code it reads to root-cause, the fix, and the tests together.
executor:
  type: omnigent
  model: "databricks-claude-fable-5-1"
  context_window: 1000000
  reasoning_effort: xhigh
  config:
    harness: claude-sdk
    permission_mode: bypassPermissions

# AGENTS.md routes phases to bundled skills; detailed procedures load on demand.
instructions: AGENTS.md

# Grant sys_session_share authority to grant the __public__ sentinel (anonymous
# read-only). The agent only shares when invoked with `public: true` (the
# `dev/resolve.py --public` flag) — useful when running against a shared
# `--server` so the resolve session is spectatable while it works. Still gated by
# the server's own public-sharing switch.
agent_session_sharing: public

async: true
cancellable: true

# Polly and OCR review published PRs; Resolve needs no child-session tools.
spawn: false

# os_env registers sys_os_* tools; the shell drives git/gh, review dispatch,
# and tests. Run from the repo root (`cwd: .`); unrestricted network lets the
# agent reach the repro session and GitHub.
os_env:
  type: caller_process
  cwd: .
  # BEGIN omnigent-internal CI security overlay
  sandbox:
    type: linux_bwrap
    write_paths:
      - "."
      - "/home/runner/work/omnigent-internal/omnigent-internal/omnigent-src/.git/objects"
      - "/home/runner/work/omnigent-internal/omnigent-internal/omnigent-src/.git/refs"
      - "/home/runner/work/omnigent-internal/omnigent-internal/omnigent-src/.git/logs"
      - "/home/runner/work/omnigent-internal/omnigent-internal/omnigent-src/.git/ci-packed-refs"
    cwd_allow_hidden:
      - "*"
    env_passthrough:
      - NO_PROXY
      - no_proxy
      - OMNIGENT_PW_NO_SANDBOX
      - OMNIGENT_PYTHON
      - PLAYWRIGHT_BROWSERS_PATH
      - PYTHONPATH
      - TIKTOKEN_CACHE_DIR
    read_paths:
      - "/home/runner/work/omnigent-internal/omnigent-internal/omnigent-src/.git"
      - "/home/runner/work/_temp/omnigent-resolve-harnesses/omnigent"
      - "/home/runner/work/omnigent-internal/omnigent-internal/.harness-clis"
      - "/home/runner/work/_temp/omnigent-resolve-harnesses"
      - "/home/runner/.cache/ms-playwright"
      - "/home/runner/work/_temp/tiktoken-cache"
      - "/opt/hostedtoolcache"
      - "/home/runner/work/omnigent-internal/omnigent-internal/omnigent-src/omnigent"
      - "/home/runner/work/omnigent-internal/omnigent-internal/omnigent-src/sdks/python-client/omnigent_client"
      - "/home/runner/work/omnigent-internal/omnigent-internal/omnigent-src/sdks/ui/omnigent_ui_sdk"
    egress_allow_private_destinations: true
    egress_rules:
      - "* ai-oss-ecosystem-integration-testing.cloud.databricks.com/ai-gateway/anthropic/**"
      - "* ai-oss-ecosystem-integration-testing.cloud.databricks.com/ai-gateway/codex/v1/**"
      - "* omnigent-repro-3272836215725701.aws.databricksapps.com/**"
      - "GET api.github.com/repos/omnigent-ai/omnigent/issues/**"
      - "GET api.github.com/repos/omnigent-ai/omnigent/pulls/**"
      - "GET api.github.com/repos/omnigent-ai/omnigent/actions/**"
      - "GET,HEAD results-receiver.actions.githubusercontent.com/**"
      - "GET,HEAD *.blob.core.windows.net/actions-results/**"
      - "GET github.com/omnigent-ai/omnigent/**"
      - "GET raw.githubusercontent.com/anthropics/claude-code/refs/heads/main/CHANGELOG.md"
      - "GET raw.githubusercontent.com/omnigent-ai/omnigent/**"
      - "GET objects.githubusercontent.com/**"
      - "GET user-images.githubusercontent.com/**"
      - "* registry.npmjs.org/**"
      - "* npm-proxy.cloud.databricks.com/**"
      - "GET pypi.org/simple/**"
      - "GET files.pythonhosted.org/packages/**"
      - "* pypi-proxy.cloud.databricks.com/**"
      - "* 127.0.0.1/**"
      - "* localhost/**"
      - "GET api.github.com/search/issues"
      - "POST api.github.com/graphql"
      - "GET api.github.com/repos/omnigent-ai/omnigent"
      - "GET api.github.com/repos/omnigent-ai/omnigent/**"
      - "GET github.com/omnigent-ai/omnigent/**"
      - "GET github.com/omnigent-ai/omnigent.git/**"
      - "POST github.com/omnigent-ai/omnigent/git-upload-pack"
      - "POST github.com/omnigent-ai/omnigent.git/git-upload-pack"
      - "GET raw.githubusercontent.com/omnigent-ai/omnigent/**"
      - "GET codeload.github.com/omnigent-ai/omnigent/**"
      - "* api.cursor.com/**"
      - "* api2.cursor.sh/**"
      - "* api3.cursor.sh/**"
      - "* api4.cursor.sh/**"
      - "* api5.cursor.sh/**"
      - "* agent.cursor.sh/**"
      - "* agent.api5.cursor.sh/**"
      - "* agentn.us.api5.cursor.sh/**"
      - "POST api.linear.app/graphql"
      - "PUT uploads.linear.app/**"
      - "GET uploads.linear.app/**"
      - "* api.github.com/**"
      - "* github.com/**"
      - "* uploads.github.com/**"
    credential_proxy:
      - type: https_bearer
        target: "ai-oss-ecosystem-integration-testing.cloud.databricks.com"
        source: {env: DATABRICKS_REPRO_GATEWAY_TOKEN}
        env: LLM_API_KEY
      - type: gh_basic
        source:
          unix_socket: "/home/runner/work/_temp/resolve-github-credentials/token.sock"
          refresh_interval_seconds: 60
      - type: https_bearer
        target: "api.linear.app"
        source: {env: DATABRICKS_REPRO_LINEAR_TOKEN}
        env: LINEAR_API_KEY
    # Cursor uses HTTP/2 for agent turns. Its key is resolved by
    # the trusted runner and passed directly to the Cursor harness;
    # binding these hosts to a rewrite rule would block opaque h2 relay.

# Block only the catastrophic shell set (force-push, `rm -rf /`, hard reset to a
# remote ref); everything else runs without an ASK gate so the agent stays
# non-interactive. This agent DOES push (repeatedly, as it iterates on CI and the
# automated review), comment on PRs, label them, request reviewers, and open a
# PR — but with `gate_pushes: false` those outward commands run unattended instead
# of ASK-prompting mid-run, which is required for the CI (`ci_link`) path where
# nobody is at a terminal to approve. The human gate is moved up-front:
# `dev/resolve.py` confirms before it launches the agent (skip with `--yes`), and
# the ready-for-review PR is reviewed after the fact. Force-push and the other
# catastrophic set stay DENY-listed.
guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
